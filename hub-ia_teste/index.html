<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub-ia</title>
    <link rel="stylesheet" href="">

    <style>
        /* estilo base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Base style for mobile devices */
        body {
            padding: 20px;
            background-color: olive;
            color: white;
            font-family: Arial, sans-serif;
            height: 300vh;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            gap: 15px;
            justify-content: center;
            height: 200px;
            flex-wrap: wrap;
            margin-bottom: 15px;

        }

        .box {
            width: 100%;
            max-width: 400px;
            height: 200px;
            background-color: black;
        }

        .container-position{
            width: 100%;
            border: 2px solid red;
            height: 600px;
            margin-top: 15px;
            position: relative;
        }

        .filho-tamanho{
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: blueviolet;

        }

        .filho01__container-position{
            top: 0;
            left: 0;
        }

        .filho02__container-position{
            top: 0;
            right: 0;
        }

        .filho03__container-position{
            bottom: 0;
            left: 0;
        }

        .filho04__container-position{
            bottom: 0;
            right: 0;
            
        }

        .whats{
            width: 75px;
            height: 75px;
            background-color: green;
            border-radius: 50%;
            border: 5px solid #ffff;
            position: fixed;
            bottom: 100px;
            right: 60px;
            box-shadow: 2px 3px 2px red
        }

        .whats img{
            width: 70px;
            height: 70px;
        }

        /* For devices with a minimum width of 768px (Medium) */
        @media (min-width: 768px) {
            body {
                background-color: blue;
                color: white;
            }
            .box{
                max-width: 350px;
            }
        }

        /* For devices with a minimum width of 992px (Large) */
        @media (min-width: 992px) {
            body {
                background-color: tan;
                color: black;
            }
            .box{
                max-width: 450px;
            }
        }
    </style>
</head>

<body>
    <h1>Este é um teste de @media.</h1>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="container-position">

        <div class="filho01__container-position filho-tamanho"></div>
        <div class="filho02__container-position filho-tamanho"></div>
        <div class="filho03__container-position filho-tamanho"></div>
        <div class="filho04__container-position filho-tamanho"></div>
        
    </div>

    <div class="whats">
        <img src="./img/whatsapp_certo.png" alt="logo whatsapp">
    </div>

</body>

</html>
